<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hangar · Aircraft explorer</title>
  <meta name="description" content="Browse, explore and compare aircraft: speeds, weights, range, runway needs and flight envelopes.">
  <meta name="theme-color" content="#0a0e15">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    var t = 'dark';
    try { t = localStorage.getItem('hangar-theme') || 'dark'; } catch (e) {}
    document.documentElement.dataset.theme = t;
  </script>
  <link rel="stylesheet" href="css/app.css?v=6">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <button class="icon-btn nav-ic" id="nav-back" aria-label="Back" title="Back" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon-btn nav-ic" id="nav-home" aria-label="Home" title="Home" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="Hangar home">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
        Hangar
      </a>
      <a class="nav-link nav-browse" id="nav-browse" href="#/">Browse</a>
      <a class="nav-link" id="nav-compare" href="#/compare">Compare</a>
      <div class="seg" id="units" role="group" aria-label="Units">
        <button data-u="metric" title="km/h, m, km, kg">Metric</button>
        <button data-u="aviation" title="knots, feet, nautical miles, pounds, with metric in brackets">kt / ft</button>
      </div>
      <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Light / dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <div class="tray" id="tray" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    <div class="lb-stage" id="lb-stage">
      <img id="lb-img" alt="">
      <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
      <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">›</button>
    </div>
    <div class="lb-cap" id="lb-cap"></div>
  </div>

  <script src="js/data.js?v=9"></script>
  <script src="js/variants.js?v=8"></script>
  <script src="js/drone-variants.js?v=8"></script>
  <script src="js/civil-variants.js?v=9"></script>
  <script src="js/variant-perf.js?v=4"></script>
  <script src="js/units.js?v=2"></script>
  <script src="js/wiki.js?v=1"></script>
  <script src="js/envelope.js?v=8"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
